<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求職者一覧 | 履歴書・職務経歴書 作成ツール</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <h1>履歴書・職務経歴書 作成ツール</h1>
  <nav>
    <a href="index.html">トップ</a>
    <a href="candidates.html" class="active">求職者一覧</a>
  </nav>
</header>

<div id="loginGate" class="login-gate" style="display:none;">
  <div class="login-box">
    <h2 style="margin-top:0;">スタッフログイン</h2>
    <div class="field">
      <label>スタッフ名</label>
      <input type="text" id="loginName" autocomplete="username">
    </div>
    <div class="field">
      <label>パスワード</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <div id="loginError" style="color:#b00020;font-size:13px;min-height:1.2em;"></div>
    <button class="btn btn-primary" id="loginBtn" type="button">ログイン</button>
  </div>
</div>

<main class="landing" id="candidatesMain" style="display:none;">
  <div class="candidates-toolbar">
    <h2 style="margin:0;">求職者一覧</h2>
    <div style="display:flex;gap:10px;align-items:center;">
      <span id="loggedInAs" style="font-size:12px;color:#666;"></span>
      <button class="btn btn-small" id="logoutBtn" type="button">ログアウト</button>
      <button class="btn btn-primary" id="addCandidateBtn">+ 新しい求職者を追加</button>
    </div>
  </div>

  <div id="emptyState" class="notice-box" style="display:none;">
    まだ求職者が登録されていません。「+ 新しい求職者を追加」から始めてください。
  </div>

  <table class="candidates-table" id="candidatesTable" style="display:none;">
    <thead>
      <tr>
        <th>氏名</th>
        <th>更新日時</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="candidatesBody"></tbody>
  </table>
</main>

<script src="js/storage.js"></script>
<script src="js/sync.js"></script>
<script src="js/candidates.js"></script>
</body>
</html>
